services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; case \"$$line\" in *\" 200 \"*) exit 0;; *) echo \"$$line\"; exit 1;; esac'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_metadata}
      MYSQL_USER: ${MYSQL_USER:-rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rag_root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VECTOR_STORE_PROVIDER: qdrant
      VECTOR_STORE_URL: http://qdrant:6333
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_COLLECTION: ${VECTOR_STORE_COLLECTION:-enterprise_kb}
      VECTOR_STORE_DISTANCE_METRIC: ${VECTOR_STORE_DISTANCE_METRIC:-cosine}
      REDIS_URL: redis://redis:6379/0
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-rag-cache}
      CACHE_ENABLED: "true"
      CACHE_EMBEDDING_ENABLED: "true"
      CACHE_RETRIEVAL_ENABLED: "true"
      CACHE_ANSWER_ENABLED: "true"
      ACL_ENABLED: "true"
      ACL_DEFAULT_DENY: "true"
      ACL_PRINCIPAL_HEADER: X-Principal
      ACL_ALLOW_BODY_PRINCIPAL: "false"
      ACL_INGEST_BINDINGS_ENABLED: "false"
      METADATA_DB_URL: mysql://${MYSQL_USER:-rag_user}:${MYSQL_PASSWORD:-rag_password}@mysql:3306/${MYSQL_DATABASE:-rag_metadata}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-rag_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_metadata}
      OBSERVABILITY_ENABLED: "true"
      AUDIT_ENABLED: "true"
      METRICS_ENABLED: "true"
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:?Set AUDIT_HASH_SALT in .env before starting the compose stack}
      AUDIT_LOG_PATH: logs/audit.jsonl
      METRICS_PATH: /metrics
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2.0}
      RAGAS_ENABLED: "false"
      RUN_RAGAS_EVAL: "false"
      RAGAS_DO_NOT_TRACK: "true"
      RUN_COMPOSE_INIT: ${RUN_COMPOSE_INIT:-true}
      COMPOSE_INIT_KNOWLEDGE_BASE_PATH: /app/eval/fixtures/knowledge_base
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  qdrant_data:
  redis_data:
  mysql_data:
